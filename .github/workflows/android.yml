name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate
        run: >-
          ./gradlew
          :app:assemblePersonalDebug :app:assembleBotDebug
          :app:testPersonalDebugUnitTest :app:testBotDebugUnitTest
          :app:lintPersonalDebug :app:lintBotDebug
          --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
